# Site settings
title: COMP4431 Course Notes
description: My notes for COMP4431 - Multimedia Computing
author: Iris Chen
email: your.email@connect.polyu.hk

# Theme
remote_theme: just-the-docs/just-the-docs

# URL settings
baseurl: "/comp4431-notes"
url: "https://irischen04.github.io"

# Color scheme
color_scheme: light

# Navigation and search
nav_enabled: true
search_enabled: true
heading_anchors: true

# 侧边栏设置
nav_sort: case_insensitive

# Back to top button
back_to_top: true
back_to_top_text: "Back to top"

# Footer
footer_content: "Copyright &copy; 2025 Iris Chen. COMP4431 Course Notes."

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - vendor/
