# Site settings
title: COMP4431 Course Notes
description: My notes for COMP4431 - Multimedia Computing
author: Iris Chen
email: your.email@connect.polyu.hk

# Theme
remote_theme: just-the-docs/just-the-docs

# URL settings
baseurl: "/comp4431-notes"
url: "https://irischen04.github.io"

# Navigation and search
nav_enabled: true
search_enabled: true
heading_anchors: true

# Color scheme
color_scheme: light

# Markdown settings
markdown: kramdown
kramdown:
  parse_block_html: true
  syntax_highlighter: rouge

# Mermaid support
mermaid:
  version: "10.6.1"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-github-metadata

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - vendor/

# Just the Docs specific settings
# Enable back to top button
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: "Copyright &copy; 2025 Iris Chen. COMP4431 Course Notes."
